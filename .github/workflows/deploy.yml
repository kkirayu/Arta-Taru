name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # TiDB Cloud credentials (set in GitHub Secrets)
      DB_CONNECTION: mysql
      DB_HOST: ${{ secrets.TIDB_HOST }}
      DB_PORT: ${{ secrets.TIDB_PORT }}
      DB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      DB_USERNAME: ${{ secrets.TIDB_USERNAME }}
      DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      MYSQL_ATTR_SSL_CA: /etc/ssl/certs/ca-certificates.crt
      DB_SSL_MODE: VERIFY_IDENTITY
      APP_ENV: production
      APP_DEBUG: false
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, intl, zip, bcmath
          ini-values: memory_limit=512M
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Run database migrations
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction || true
        env:
          APP_KEY: ${{ secrets.APP_KEY }}

      - name: Install Node & build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Vercel deployment failed for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* :x:\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}